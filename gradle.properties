group = cz.loplex
version = 0.2.0-SNAPSHOT

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# The debug agent (src/main/java) is intentionally compiled to Java 8 bytecode so it loads in
# foreign JVMs (the forked BeanShell interpreter and the Maven JVM, which may run an older JDK),
# while the Kotlin plugin code targets JVM 21. This per-jar target mix is safe — the agent never
# runs alongside the Kotlin classes in the foreign JVM — so downgrade the consistency check.
kotlin.jvm.target.validation.mode = warning

# VerifyPluginProjectConfigurationTask reads Java sourceCompatibility from the :plugin:compileJava
# task specifically (see its source), which is the Java-8-targeted debug agent above, not the
# Kotlin plugin code the platform version check actually cares about. Mute that one false positive;
# every other configuration check this task runs still reports normally.
org.jetbrains.intellij.platform.verifyPluginProjectConfigurationMutedMessages = Java sourceCompatibility too low for target platform
