Wraps the expression before the postfix dot in a surrounding construct.
<!-- tooltip end -->
<p><code>expr.sout</code> becomes <code>print(expr);</code>,
<code>expr.if</code> becomes <code>if (expr) {...}</code>, and
<code>expr.while</code> becomes <code>while (expr) {...}</code>.</p>
</body>
